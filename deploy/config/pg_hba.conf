# ============================================================
# PostgreSQL 16 pg_hba.conf — 飞检现场管理系统 (WI-0001 / TASK-001)
# 关联设计: DD-7 §7 安全设计
#
# 安全基线:
#   - PG 仅监听 127.0.0.1（postgresql-16.conf: listen_addresses）
#   - 本地 Unix socket: peer 认证（OS 用户映射）
#   - 本机 TCP: scram-sha-256 强哈希认证
#   - 不配置外部 host 连接
# ============================================================

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# 本地 Unix socket 连接 — peer 认证（避免密码明文配置文件）
local   all             all                                     peer

# 本机 TCP IPv4 连接 — scram-sha-256 强哈希
host    all             all             127.0.0.1/32            scram-sha-256

# 本机 TCP IPv6 连接 — scram-sha-256 强哈希
host    all             all             ::1/128                 scram-sha-256

# 不配置外部 host 连接 — PG 只监听 127.0.0.1，Nginx 反代到后端
# 如需后续配置主从复制，请单独添加 replication 行并限定来源 IP
