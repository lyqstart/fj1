# ============================================================
# PostgreSQL 16 配置文件 — 飞检现场管理系统 (WI-0001 / TASK-001)
# 关联设计: DD-7 §4.3 内存调优
#
# 服务器: svr-lg (3.6GB 内存, 单机裸机部署)
# 内存分配: OS+服务 ~0.5G | PG ~0.8G | JVM ~1.0G | Nginx ~0.1G | 预留 ~1.2G
# ============================================================

# ----------------------
# 连接 / 内存 (DD-7 §4.3)
# ----------------------
shared_buffers = 512MB              # PG 共享内存缓冲池（3.6GB 服务器分配 512MB）
effective_cache_size = 1GB          # 告诉优化器可用缓存总量（含 OS page cache）
work_mem = 4MB                      # 单查询排序/哈希内存
maintenance_work_mem = 64MB         # VACUUM / CREATE INDEX 内存
max_connections = 50                # 10-20 并发用户，留余量

# ----------------------
# WAL / Checkpoint
# ----------------------
wal_buffers = 16MB
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 256MB

# ----------------------
# 查询规划 (SSD 优化)
# ----------------------
random_page_cost = 1.1              # SSD 随机读成本接近顺序读
effective_io_concurrency = 200      # SSD 支持高并发 IO

# ----------------------
# 日志
# ----------------------
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 500    # 慢查询阈值 500ms

# ----------------------
# 监听地址
# 仅监听本地，Nginx 反代到后端（DD-7 安全基线）
# ----------------------
listen_addresses = '127.0.0.1'
port = 5432

# ----------------------
# 认证（配合 pg_hba.conf）
# PG16 默认 scram-sha-256
# ----------------------
password_encryption = scram-sha-256

# ----------------------
# 自动 VACUUM
# ----------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 60s

# ----------------------
# 时区
# ----------------------
timezone = 'Asia/Shanghai'
log_timezone = 'Asia/Shanghai'

# ----------------------
# 并行查询
# ----------------------
max_worker_processes = 8
max_parallel_workers_per_gather = 2
max_parallel_workers = 8
