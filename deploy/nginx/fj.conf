# 飞检现场管理系统 — Nginx 反向代理配置
# 部署到 /etc/nginx/conf.d/fj.conf（需用户手动 sudo cp）

# 优化参数 — 4 vCPU 服务器
worker_processes 4;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式（含 trace 上下文）
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/fj-access.log main;
    error_log  /var/log/nginx/fj-error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    # 照片分片上传支持 15MB
    client_max_body_size 15m;

    # keepalive
    keepalive_timeout 65;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 上游后端
    upstream fj_backend {
        server 127.0.0.1:8080;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # Web 前端静态资源
        root /opt/fj/web;
        index index.html;

        # SPA 路由 — 前端路由回退到 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API 反向代理
        location /api/ {
            proxy_pass http://fj_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # 照片内部重定向 — X-Accel-Redirect（防止 Java 读大文件到内存）
        # Java 端设置 response.setHeader("X-Accel-Redirect", "/internal/photos/xxx.jpg")
        # Nginx 直接从磁盘发送文件，不经过 Java
        location /internal/photos/ {
            internal;
            alias /data/photos/;
        }

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # 健康检查端点
        location /api/actuator/health {
            proxy_pass http://fj_backend;
            access_log off;
        }
    }
}
