server:
  port: 8080
  servlet:
    context-path: /api

spring:
  profiles:
    active: prod
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/fj_inspect
    username: ${DB_USER:fj_app}
    password: ${DB_PASSWORD}  # 无默认值，必须注入
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

fj:
  security:
    jwt:
      secret: ${JWT_SECRET}  # 无默认值！必须注入，至少32字符
      expire-minutes: 30
      refresh-expire-days: 7
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
      allow-credentials: true
  cache:
    caffeine:
      expire-minutes: 30
      max-size: 10000
  export:
    template-fallback: false  # 生产环境模板缺失时 fail-fast（G11）

logging:
  level:
    root: INFO
    com.fj: INFO
    org.hibernate.SQL: WARN
  file:
    name: /opt/fj/api/logs/fj-api.log

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
